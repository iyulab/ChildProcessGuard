name: .NET Build and NuGet Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Directory.Build.props'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_PATH: 'src/ChildProcessGuard/ChildProcessGuard.csproj'
  TEST_PATH: 'tests/ChildProcessGuard.Tests/ChildProcessGuard.Tests.csproj'

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS has no /proc: its process-tree enumeration (libproc) only runs on a macOS runner.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.TEST_PATH }}

    # Builds every library target (the test project only pulls in the ones it references).
    - name: Build library
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release

    - name: Build tests
      run: dotnet build ${{ env.TEST_PATH }} --configuration Release --no-restore

    # The whole suite runs here, including tests that start real child processes and the
    # platform-specific tests, so both termination paths are exercised on their own OS.
    # global.json selects Microsoft.Testing.Platform as the dotnet test runner (xunit.v3).
    - name: Test
      # --output Detailed lists every test as it finishes and --long-running names any test still
      # running after 60 s; the step timeout fails a hung run with its log kept (a cancelled job
      # loses the log of the step that was running).
      if: runner.os != 'macOS'
      timeout-minutes: 15
      run: dotnet test --project ${{ env.TEST_PATH }} --configuration Release --no-build --output Detailed --long-running 60

    # TEMPORARY macOS diagnosis: running the whole suite in one test process leaves the macOS
    # runner unresponsive (even step timeouts stop working), while each class passes on its own.
    # The suite runs as 'nobody' so that whatever it does to other processes cannot reach the
    # runner agent, and the verbose reporter shows the last test that started.
    - name: "macOS diag: process limits"
      if: runner.os == 'macOS'
      run: |
        sysctl kern.maxproc kern.maxprocperuid
        ulimit -u
        ps -A | wc -l
    - name: "macOS diag: net9.0 whole suite as nobody, process count sampled"
      if: runner.os == 'macOS'
      timeout-minutes: 6
      continue-on-error: true
      run: |
        sudo chmod o+x "$HOME" "$(dirname "$GITHUB_WORKSPACE")" "$(dirname "$DOTNET_ROOT")" || true
        sudo chmod -R o+rX "$GITHUB_WORKSPACE" "$DOTNET_ROOT" || true
        ( max=0; while sleep 0.2; do n=$(ps -U nobody -o pid= | wc -l); [ $n -gt $max ] && max=$n && echo "[sampler] nobody processes: $max"; done ) &
        sampler=$!
        sudo -u nobody env HOME=/tmp TMPDIR=/tmp DOTNET_CLI_HOME=/tmp DOTNET_ROOT="$DOTNET_ROOT" PATH="$PATH" "$DOTNET_ROOT/dotnet" tests/ChildProcessGuard.Tests/bin/Release/net9.0/ChildProcessGuard.Tests.dll -noColor
        kill $sampler
    - name: "macOS diag: runner processes before"
      if: runner.os == 'macOS'
      run: ps -U "$(id -u)" -o pid,ppid,pgid,stat,comm
    - name: "macOS diag: net9.0 whole suite as runner, serial"
      if: runner.os == 'macOS'
      timeout-minutes: 5
      continue-on-error: true
      run: dotnet tests/ChildProcessGuard.Tests/bin/Release/net9.0/ChildProcessGuard.Tests.dll -parallel none -reporter verbose -noColor
    - name: "macOS diag: after"
      if: always() && runner.os == 'macOS'
      run: |
        ps -A | wc -l
        ps -A -o pid,ppid,user,comm | grep -v ' root ' | tail -40

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Extract version from Directory.Build.props
      id: get_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Check if version tag exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.get_version.outputs.version }} already exists; nothing to publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Pack
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --output nupkg

    # Publish before tagging: a failed push must not leave a tag behind, or every later run
    # would skip publishing for this version.
    - name: Push to NuGet
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

    - name: Create Git Tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
        git push origin "v${{ steps.get_version.outputs.version }}"

    - name: Create GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ```bash
          dotnet add package ChildProcessGuard --version ${{ steps.get_version.outputs.version }}
          ```
        draft: false
        prerelease: false
        files: ./nupkg/*.nupkg
